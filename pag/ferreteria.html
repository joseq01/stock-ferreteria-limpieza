<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lista  de  Artículos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #contenido-imprimir, #contenido-imprimir * {
        visibility: visible;
      }
      #contenido-imprimir {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
      }
      nav, footer, .no-print {
        display: none !important;
      }
    }
    #mensajeCarga, #mensajeConfirmacion {
      position: fixed;
      right: 20px;
      z-index: 1050;
    }
    #mensajeCarga {
      top: 140px;
    }
    #mensajeConfirmacion {
      top: 80px;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100" style="padding-top: 80px;">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Control de Stock</a>
    <img id="logo" src="../image/Logos-Janos.png" width="100" alt="logojanos" />
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link active" href="../index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">Ferretería</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Opciones</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="../pag/Ferreteriaingreso.html">Ingresos</a></li>
            <li><a class="dropdown-item" href="../pag/ferreteriapedidos.html">Pedidos</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Contenido -->
<div id="contenido-imprimir" class="container mt-5">
  <h2 class="text-center mb-4">Stock Actual</h2>

  <!-- Buscador -->
  <div class="mb-3">
    <input type="text" id="buscador" class="form-control" placeholder="Buscar artículo..." oninput="filtrarTabla()">
  </div>

  <!-- Tabla -->
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Artículo</th>
        <th>Cantidad Comprada</th>
        <th>Cantidad Pedida</th>
        <th>Stock Actual</th>
      </tr>
    </thead>
    <tbody id="tablaStockActual"></tbody>
  </table>

  <div class="d-flex justify-content-between sticky-bottom bg-white py-2">
    <button class="btn btn-success" onclick="guardarCambios()">Guardar Cambios</button>
    <button class="btn btn-secondary no-print" onclick="window.print()">Imprimir</button>
  </div>
</div>

<!-- Mensajes -->
<div id="mensajeConfirmacion" class="alert alert-success text-center mx-3 d-none" role="alert">Pedidos actualizados correctamente.</div>
<div id="mensajeCarga" class="alert alert-warning text-center mx-3 d-none" role="alert">Cargando datos... Esto podría tardar un momento.</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
  import {
    getFirestore, collection, onSnapshot, setDoc, doc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCqaYq0CfEVhjj3Sk7MufFEpd-j8-YGYV8",
    authDomain: "stock-ferreteria-limpieza.firebaseapp.com",
    projectId: "stock-ferreteria-limpieza",
    storageBucket: "stock-ferreteria-limpieza.appspot.com",
    messagingSenderId: "958385126824",
    appId: "1:958385126824:web:a2d630678db1edae85319d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let stockGlobal = {};
  let cambiosPendientes = {};

  function mostrarMensajeCarga() {
    document.getElementById("mensajeCarga").classList.remove("d-none");
  }

  function ocultarMensajeCarga() {
    document.getElementById("mensajeCarga").classList.add("d-none");
  }

  function mostrarStockEnTiempoReal() {
    let timeout = setTimeout(mostrarMensajeCarga, 3000);

    const ingresosRef = collection(db, "comprasferreteria");
    const pedidosRef = collection(db, "pedidosferreteria");

    let ingresos = {};
    let pedidos = {};

    const actualizarStock = () => {
      const stock = {};

      for (const [articulo, cantidad] of Object.entries(ingresos)) {
        if (!stock[articulo]) stock[articulo] = { compra: 0, pedido: 0 };
        stock[articulo].compra = cantidad;
      }

      for (const [articulo, cantidad] of Object.entries(pedidos)) {
        if (!stock[articulo]) stock[articulo] = { compra: 0, pedido: 0 };
        stock[articulo].pedido = cantidad;
      }

      stockGlobal = stock;
      renderizarTabla(stock);
      clearTimeout(timeout);
      ocultarMensajeCarga();
    };

    onSnapshot(ingresosRef, snapshot => {
      ingresos = {};
      snapshot.forEach(doc => {
        const data = doc.data();
        const art = data.articulo.toLowerCase();
        ingresos[art] = (ingresos[art] || 0) + parseInt(data.cantidad);
      });
      actualizarStock();
    });

    onSnapshot(pedidosRef, snapshot => {
      pedidos = {};
      snapshot.forEach(doc => {
        const data = doc.data();
        const art = data.articulo.toLowerCase();
        pedidos[art] = (pedidos[art] || 0) + parseInt(data.cantidad);
      });
      actualizarStock();
    });
  }

  function renderizarTabla(stock) {
    const tabla = document.getElementById("tablaStockActual");
    tabla.innerHTML = "";

    for (let articulo in stock) {
      const compra = stock[articulo].compra;
      const pedido = cambiosPendientes[articulo] ?? stock[articulo].pedido;
      const restante = compra - pedido;

      const fila = document.createElement("tr");
      fila.innerHTML = `
        <td>${articulo}</td>
        <td>${compra}</td>
        <td>
          <input type="number" class="form-control pedido"
                 id="pedido-${articulo}"
                 value="${pedido}"
                 onchange="actualizarPedido('${articulo}', ${compra})">
        </td>
        <td><span id="stock-${articulo}">${restante}</span></td>
      `;
      tabla.appendChild(fila);
    }
  }

  window.actualizarPedido = function (articulo, compra) {
    const input = document.getElementById(`pedido-${articulo}`);
    const nuevoPedido = parseInt(input.value) || 0;
    cambiosPendientes[articulo] = nuevoPedido;
    const nuevoStock = compra - nuevoPedido;
    document.getElementById(`stock-${articulo}`).innerText = nuevoStock;
  };

  window.guardarCambios = async function () {
    mostrarMensajeCarga();

    for (const [articulo, cantidad] of Object.entries(cambiosPendientes)) {
      if (!isNaN(cantidad) && cantidad >= 0) {
        const docRef = doc(db, "pedidosferreteria", articulo);

        if (cantidad === 0) {
          await deleteDoc(docRef);
        } else {
          await setDoc(docRef, {
            articulo: articulo,
            cantidad: cantidad,
            fecha: new Date().toLocaleDateString("es-AR")
          });
        }
      }
    }

    cambiosPendientes = {};
    ocultarMensajeCarga();
    const mensaje = document.getElementById("mensajeConfirmacion");
    mensaje.classList.remove("d-none");
    setTimeout(() => mensaje.classList.add("d-none"), 3000);
  };

  window.filtrarTabla = function () {
    const texto = document.getElementById("buscador").value.toLowerCase();
    const filtrado = {};

    for (let art in stockGlobal) {
      if (art.includes(texto)) {
        filtrado[art] = stockGlobal[art];
      }
    }

    renderizarTabla(filtrado);
  };

  window.addEventListener("DOMContentLoaded", mostrarStockEnTiempoReal);
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-auto">
  © 2025 Todos los derechos reservados para Jose Quin
</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100" onload="cargarListaPedidos()">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Control de Stock</a>
    <img id="logo" src="../image/Logos-Janos.png" width="100" alt="logojanos">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" href="../pag/ferreteria.html">Ferretería</a>
        </li>
        <li><a class="nav-link active" href="#">Pedidos</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <h2 class="text-center">Pedidos</h2>

  <!-- ALERTA / TOAST -->
  <div id="toastContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

  <!-- FORMULARIO -->
  <div class="card p-3">
    <div class="mb-3">
      <label for="articulo" class="form-label">Artículo:</label>
      <input type="text" id="articulo" class="form-control" list="listaSugerencias" placeholder="Nombre del artículo">
      <datalist id="listaSugerencias"></datalist>
    </div>
    <div class="mb-3">
      <label for="cantidad" class="form-label">Cantidad:</label>
      <input type="number" id="cantidad" class="form-control" placeholder="Cantidad">
    </div>
    <button class="btn btn-primary" onclick="agregarArticulo()">Agregar a la Lista</button>
  </div>

  <!-- TABLA -->
  <h3 class="mt-4">Lista de Pedidos:</h3>
  <table class="table table-striped mt-2">
    <thead>
      <tr>
        <th>Artículo</th>
        <th>Cantidad</th>
        <th>Fecha</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaArticulos"></tbody>
  </table>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function mostrarToast(mensaje, tipo = "danger") {
    const toastContainer = document.getElementById("toastContainer");
    const toast = document.createElement("div");

    toast.className = `toast align-items-center text-bg-${tipo} border-0 show`;
    toast.setAttribute("role", "alert");
    toast.setAttribute("aria-live", "assertive");
    toast.setAttribute("aria-atomic", "true");
    toast.innerHTML = `
      <div class="d-flex">
        <div class="toast-body">${mensaje}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    `;

    toastContainer.appendChild(toast);

    setTimeout(() => {
      toast.remove();
    }, 4000);
  }

  function agregarArticulo() {
    const compras = JSON.parse(localStorage.getItem("listaCompras")) || [];
    const pedidos = JSON.parse(localStorage.getItem("listaPedidos")) || [];
    const stock = {};

    compras.forEach(item => {
      const articulo = item.articulo.toLowerCase();
      const cantidad = parseInt(item.cantidad);
      if (!stock[articulo]) stock[articulo] = { compra: 0, pedido: 0 };
      stock[articulo].compra += cantidad;
    });

    pedidos.forEach(item => {
      const articulo = item.articulo.toLowerCase();
      const cantidad = parseInt(item.cantidad);
      if (!stock[articulo]) stock[articulo] = { compra: 0, pedido: 0 };
      stock[articulo].pedido += cantidad;
    });

    let articulo = document.getElementById("articulo").value.trim().toLowerCase();
    let cantidad = parseInt(document.getElementById("cantidad").value.trim());

    if (articulo === "" || isNaN(cantidad) || cantidad <= 0) {
      mostrarToast("Por favor, ingresa un artículo y una cantidad válida mayor a cero.");
      return;
    }

    if (!stock[articulo] || stock[articulo].compra === 0) {
      mostrarToast("Este artículo no está en la lista de compras o no tiene stock disponible.");
      return;
    }

    const disponible = stock[articulo].compra - stock[articulo].pedido;

    if (cantidad > disponible) {
      mostrarToast(`No hay suficiente stock. Disponible: ${disponible}`);
      return;
    }

    const fecha = new Date().toLocaleDateString("es-AR");
    let listaPedidos = JSON.parse(localStorage.getItem("listaPedidos")) || [];
    listaPedidos.push({ articulo, cantidad, fecha });
    localStorage.setItem("listaPedidos", JSON.stringify(listaPedidos));

    cargarListaPedidos();
    document.getElementById("articulo").value = "";
    document.getElementById("cantidad").value = "";
    mostrarToast("Artículo agregado correctamente", "success");
  }

  function cargarListaPedidos() {
    let tabla = document.getElementById("tablaArticulos");
    let sugerencias = document.getElementById("listaSugerencias");
    tabla.innerHTML = "";
    sugerencias.innerHTML = "";

    let listaPedidos = JSON.parse(localStorage.getItem("listaPedidos")) || [];
    let articulosUnicos = new Set();

    listaPedidos.forEach((item, index) => {
      let fila = document.createElement("tr");
      fila.innerHTML = `
        <td>${item.articulo}</td>
        <td>${item.cantidad}</td>
        <td>${item.fecha || "-"}</td>
        <td>
          <button class="btn btn-danger btn-sm" onclick="eliminarFila(${index})">Eliminar</button>
        </td>
      `;
      tabla.appendChild(fila);
      articulosUnicos.add(item.articulo);
    });

    articulosUnicos.forEach(art => {
      let option = document.createElement("option");
      option.value = art;
      sugerencias.appendChild(option);
    });
  }

  function eliminarFila(index) {
    let listaPedidos = JSON.parse(localStorage.getItem("listaPedidos")) || [];
    listaPedidos.splice(index, 1);
    localStorage.setItem("listaPedidos", JSON.stringify(listaPedidos));
    cargarListaPedidos();
    mostrarToast("Artículo eliminado", "warning");
  }
</script>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3 mt-auto">
  © 2025 Todos los derechos reservados para Jose Quin
</footer>

</body>
</html>

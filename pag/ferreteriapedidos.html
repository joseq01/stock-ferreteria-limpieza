<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lista de Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Control de Stock</a>
    <img id="logo" src="../image/Logos-Janos.png" width="100" alt="logojanos">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link active" href="../pag/ferreteria.html">Ferretería</a></li>
        <li><a class="nav-link active" href="#">Pedidos</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <h2 class="text-center">Pedidos</h2>

  <!-- ALERTA / TOAST -->
  <div id="toastContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

  <!-- FORMULARIO -->
  <div class="card p-3">
    <div class="mb-3">
      <label for="articulo" class="form-label">Artículo:</label>
      <input type="text" id="articulo" class="form-control" list="listaSugerencias" placeholder="Nombre del artículo">
      <datalist id="listaSugerencias"></datalist>
    </div>
    <div class="mb-3">
      <label for="cantidad" class="form-label">Cantidad:</label>
      <input type="number" id="cantidad" class="form-control" placeholder="Cantidad">
    </div>
    <button class="btn btn-primary" onclick="agregarArticulo()">Agregar a la Lista</button>
  </div>

  <!-- BÚSQUEDA -->
  <input type="text" class="form-control mt-4" id="busqueda" placeholder="Buscar artículo..." oninput="filtrarTabla()">

  <!-- MENSAJE DE CARGA -->
  <div id="mensajeCarga" class="text-center text-muted mt-3">Cargando datos...</div>

  <!-- TABLA -->
  <h3 class="mt-4">Lista de Pedidos:</h3>
  <table class="table table-striped mt-2">
    <thead>
      <tr>
        <th>Artículo</th>
        <th>Cantidad</th>
        <th>Fecha</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaArticulos"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, getDocs
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCqaYq0CfEVhjj3Sk7MufFEpd-j8-YGYV8",
    authDomain: "stock-ferreteria-limpieza.firebaseapp.com",
    projectId: "stock-ferreteria-limpieza",
    storageBucket: "stock-ferreteria-limpieza.appspot.com",
    messagingSenderId: "958385126824",
    appId: "1:958385126824:web:a2d630678db1edae85319d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const colPedidos = collection(db, "pedidosferreteria");
  const colCompras = collection(db, "comprasferreteria");

  async function agregarArticulo() {
    const inputArticulo = document.getElementById("articulo").value.trim().toLowerCase();
    const inputCantidad = parseInt(document.getElementById("cantidad").value.trim());

    if (!inputArticulo || isNaN(inputCantidad) || inputCantidad <= 0) {
      mostrarToast("Por favor, ingresa un artículo y una cantidad válida mayor a cero.");
      return;
    }

    const comprasSnap = await getDocs(colCompras);
    const pedidosSnap = await getDocs(colPedidos);
    const stock = {};

    comprasSnap.forEach(docSnap => {
      const data = docSnap.data();
      const art = (data.articulo || data.Artículo || "").toLowerCase();
      const cant = parseInt(data.cantidad) || 0;
      stock[art] = (stock[art] || 0) + cant;
    });

    pedidosSnap.forEach(docSnap => {
      const data = docSnap.data();
      const art = (data.articulo || data.Artículo || "").toLowerCase();
      const cant = parseInt(data.cantidad) || 0;
      stock[art] = (stock[art] || 0) - cant;
    });

    const disponible = stock[inputArticulo] || 0;

    if (inputCantidad > disponible) {
      mostrarToast(`No hay suficiente stock. Disponible: ${disponible}`);
      return;
    }

    const fecha = new Date().toLocaleDateString("es-AR");
    await addDoc(colPedidos, {
      articulo: inputArticulo,
      cantidad: inputCantidad,
      fecha
    });

    mostrarToast("Artículo agregado correctamente", "success");
    document.getElementById("articulo").value = "";
    document.getElementById("cantidad").value = "";
  }

  async function eliminarFila(id) {
    await deleteDoc(doc(db, "pedidosferreteria", id));
    mostrarToast("Artículo eliminado", "warning");
  }

  function escucharPedidosTiempoReal() {
    const tabla = document.getElementById("tablaArticulos");
    const sugerencias = document.getElementById("listaSugerencias");
    const articulosSet = new Set();
    const mensajeCarga = document.getElementById("mensajeCarga");

    onSnapshot(colPedidos, (snapshot) => {
      tabla.innerHTML = "";
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${data.articulo || data.Artículo}</td>
          <td>${data.cantidad}</td>
          <td>${data.fecha || "-"}</td>
          <td>
            <button class="btn btn-danger btn-sm" onclick="eliminarFila('${docSnap.id}')">Eliminar</button>
          </td>`;
        tabla.appendChild(fila);
      });
      mensajeCarga.style.display = "none";
      filtrarTabla(); // para mantener el filtro activo
    });

    getDocs(colCompras).then(comprasSnap => {
      sugerencias.innerHTML = "";
      comprasSnap.forEach(docSnap => {
        const data = docSnap.data();
        const art = (data.articulo || data.Artículo || "").toLowerCase();
        articulosSet.add(art);
      });
      articulosSet.forEach(art => {
        const option = document.createElement("option");
        option.value = art;
        sugerencias.appendChild(option);
      });
    });
  }

  // Filtrar la tabla según texto de búsqueda
  window.filtrarTabla = function () {
    const filtro = document.getElementById("busqueda").value.toLowerCase();
    const filas = document.querySelectorAll("#tablaArticulos tr");
    filas.forEach(fila => {
      const texto = fila.textContent.toLowerCase();
      fila.style.display = texto.includes(filtro) ? "" : "none";
    });
  };

  window.addEventListener("DOMContentLoaded", () => {
    escucharPedidosTiempoReal();
  });

  window.agregarArticulo = agregarArticulo;
  window.eliminarFila = eliminarFila;

  function mostrarToast(mensaje, tipo = "danger") {
    const toastContainer = document.getElementById("toastContainer");
    const toast = document.createElement("div");
    toast.className = `toast align-items-center text-bg-${tipo} border-0 show`;
    toast.setAttribute("role", "alert");
    toast.innerHTML = `
      <div class="d-flex">
        <div class="toast-body">${mensaje}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>`;
    toastContainer.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }
</script>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3 mt-auto">
  © 2025 Todos los derechos reservados para Jose Quin
</footer>

</body>
</html>

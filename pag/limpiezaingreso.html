<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista ingreso limpieza</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100" onload="cargarLista()">

<!-- Barra de navegación -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Control de Stock</a>
        <img id="logo" src="../image/Logos-Janos.png" width="100"  alt="logojanos">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" href="../pag/limpieza.html">limpieza</a>      
                </li>
                <li> <a class="nav-link active" href="#">Ingresos</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-center">Agregar Artículos</h2>

    <!-- Formulario -->
    <div class="card p-3">
        <div class="mb-3">
            <label for="articulo" class="form-label">Artículo:</label>
            <input type="text" id="articulo" class="form-control" list="listaSugerencias" placeholder="Nombre del artículo">
            <datalist id="listaSugerencias"></datalist>
        </div>
        <div class="mb-3">
            <label for="cantidad" class="form-label">Cantidad:</label>
            <input type="number" id="cantidad" class="form-control" placeholder="Cantidad">
        </div>
        <button class="btn btn-primary" onclick="agregarArticulo()">Agregar a la Lista</button>
    </div>

    <!-- Tabla de artículos -->
    <h3 class="mt-4">Lista de Compras:</h3>
    <table class="table table-striped mt-2">
        <thead>
            <tr>
                <th>Artículo</th>
                <th>Cantidad</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaArticulos"></tbody>
    </table>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script para manejar la tabla con localStorage y autocompletado -->
<script type="module">
window.mostrarToast = function (mensaje, tipo = "info") {
    const toast = document.getElementById("mensajeFlotante");
    toast.textContent = mensaje;
    toast.className = `alert alert-${tipo} text-center`;
    toast.classList.remove("d-none");

    setTimeout(() => {
      toast.classList.add("d-none");
    }, 3000);
  };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyCqaYq0CfEVhjj3Sk7MufFEpd-j8-YGYV8",
      authDomain: "stock-ferreteria-limpieza.firebaseapp.com",
      projectId: "stock-ferreteria-limpieza",
      storageBucket: "stock-ferreteria-limpieza.firebasestorage.app",
      messagingSenderId: "958385126824",
      appId: "1:958385126824:web:a2d630678db1edae85319d"
    };
  
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
  
    // Reemplazamos localStorage por Firestore
    window.agregarArticulo = async function () {
      const articulo = document.getElementById("articulo").value.trim();
      const cantidad = document.getElementById("cantidad").value.trim();
  
      if (articulo === "" || cantidad === "" || isNaN(cantidad) || cantidad <= 0) {
        mostrarToast("Por favor, ingresa un artículo y una cantidad válida.");
        return;
      }
  
      const fecha = new Date().toLocaleDateString('es-AR');
  
      try {
        await addDoc(collection(db, "comprasLimpieza"), {
          articulo,
          cantidad: parseInt(cantidad),
          fecha
        });
  
        cargarLista();
        document.getElementById("articulo").value = "";
        document.getElementById("cantidad").value = "";
      } catch (error) {
        console.error("Error al agregar:", error);
        mostrarToast("Error al guardar el artículo", "danger");
      }
    };
  
    window.cargarLista = async function () {
      const tabla = document.getElementById("tablaArticulos");
      const sugerencias = document.getElementById("listaSugerencias");
      tabla.innerHTML = "";
      sugerencias.innerHTML = "";
  
      const querySnapshot = await getDocs(collection(db, "comprasLimpieza"));
      const articulosUnicos = new Set();
  
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${data.articulo}</td>
          <td>${data.cantidad}</td>
          <td>${data.fecha || "-"}</td>
          <td>
            <button class="btn btn-danger btn-sm" onclick="eliminarFila('${docSnap.id}')">Eliminar</button>
          </td>
        `;
        tabla.appendChild(fila);
        articulosUnicos.add(data.articulo);
      });
  
      articulosUnicos.forEach((art) => {
        const option = document.createElement("option");
        option.value = art;
        sugerencias.appendChild(option);
      });
    };
  
    window.eliminarFila = async function (docId) {
      try {
        await deleteDoc(doc(db, "comprasLimpieza", docId));
        cargarLista();
      } catch (error) {
        console.error("Error al eliminar:", error);
        mostrarToast("Error al eliminar", "danger");
      }
    };
  
  </script>
  
<!-- Mensaje flotante -->
<div id="mensajeFlotante" class="alert alert-info text-center d-none" role="alert"
     style="position: fixed; top: 80px; right: 20px; z-index: 1050; border-radius: 0.5rem;">
</div>


<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-auto">
    © 2025 Todos los derechos reservados para Jose Quin
</footer>

</body>
</html>

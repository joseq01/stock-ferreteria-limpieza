<!-- Contenido a imprimir -->
<div id="contenido-imprimir" class="container mt-5">
  <h2 class="text-center mb-4">Stock Actual</h2>

  <div class="mb-3">
    <input type="text" id="buscador" class="form-control" placeholder="Buscar artículo..." oninput="filtrarTabla()">
  </div>
  
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Artículo</th>
        <th>Cantidad Comprada</th>
        <th>Cantidad Pedida</th>
        <th>Stock Actual</th>
      </tr>
    </thead>
    <tbody id="tablaStockActual"></tbody>
  </table>

  <div class="d-flex justify-content-between">
    <button class="btn btn-success" onclick="guardarCambios()">Guardar Cambios</button>
    <button class="btn btn-secondary no-print" onclick="window.print()">Imprimir</button>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyCqaYq0CfEVhjj3Sk7MufFEpd-j8-YGYV8",
      authDomain: "stock-ferreteria-limpieza.firebaseapp.com",
      projectId: "stock-ferreteria-limpieza",
      storageBucket: "stock-ferreteria-limpieza.appspot.com",
      messagingSenderId: "958385126824",
      appId: "1:958385126824:web:a2d630678db1edae85319d",
      measurementId: "G-3M1MNQKVYB"
    };
  
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
  
    async function mostrarStock() {
      const comprasSnapshot = await getDocs(collection(db, "comprasLimpieza"));
      const pedidosSnapshot = await getDocs(collection(db, "pedidosLimpieza"));
  
      const stock = {};
  
      comprasSnapshot.forEach(doc => {
        const { articulo, cantidad } = doc.data();
        const nombre = articulo.trim().toLowerCase();
        if (!stock[nombre]) stock[nombre] = { compra: 0, pedido: 0 };
        stock[nombre].compra += parseInt(cantidad);
      });
  
      pedidosSnapshot.forEach(doc => {
        const { articulo, cantidad } = doc.data();
        const nombre = articulo.trim().toLowerCase();
        if (!stock[nombre]) stock[nombre] = { compra: 0, pedido: 0 };
        stock[nombre].pedido += parseInt(cantidad);
      });
  
      const tabla = document.getElementById("tablaStockActual");
      tabla.innerHTML = "";
  
      for (const articulo in stock) {
        const compra = stock[articulo].compra;
        const pedido = stock[articulo].pedido;
        const restante = compra - pedido;
  
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${articulo}</td>
          <td>${compra}</td>
          <td>${pedido}</td>
          <td>${restante}</td>
        `;
        tabla.appendChild(fila);
      }
    }
  
    document.addEventListener("DOMContentLoaded", mostrarStock);

    window.filtrarTabla = function () {
  const filtro = document.getElementById("buscador").value.toLowerCase();
  const filas = document.querySelectorAll("#tablaStockActual tr");

  filas.forEach(fila => {
    const articulo = fila.children[0].textContent.toLowerCase();
    fila.style.display = articulo.includes(filtro) ? "" : "none";
  });
};
  </script>

<div id="mensajeConfirmacion" class="alert alert-success text-center mx-3 d-none" role="alert" style="position: fixed; top: 80px; right: 20px; z-index: 1050; border-radius: 0.5rem;">
    Pedidos actualizados correctamente.
